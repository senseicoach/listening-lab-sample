<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Listening Lab: Free Sample | Ron Taylor Masterclass</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#23272c; --navy-2:#2e333a; --navy-3:#3c424a; --chalk:#e8eaec; --dim:#a3aab2;
  --paper:#f5f5f3; --white:#fff; --ink:#1e2226; --muted:#5b6168; --rule:#dcdfe2;
  --gold:#4e9c93; --gold-soft:#e2f1ef;
  --missed:#f7dca4; --missed-ink:#6a4300; --extra:#b3261e;
  --p1:#2f6f69; --p2:#7a3b2e; --p3:#2f4f86; --p4:#3d6b3a; --p5:#9a5a12; --p6:#8a3b5a; --p7:#5f5a1c;
  --p8:#4b3f8f; --p9:#1f5e7a; --p10:#6b2d5c; --p11:#384a62; --p12:#8a4b12; --p13:#2d6a4f;
  --part:var(--p1);
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
[data-part="1"]{--part:var(--p1)} [data-part="2"]{--part:var(--p2)} [data-part="3"]{--part:var(--p3)}
[data-part="4"]{--part:var(--p4)} [data-part="5"]{--part:var(--p5)} [data-part="6"]{--part:var(--p6)}
[data-part="7"]{--part:var(--p7)} [data-part="8"]{--part:var(--p8)} [data-part="9"]{--part:var(--p9)}
[data-part="10"]{--part:var(--p10)} [data-part="11"]{--part:var(--p11)} [data-part="12"]{--part:var(--p12)} [data-part="13"]{--part:var(--p13)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.55;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:var(--part)}

.shell{display:grid;grid-template-columns:330px 1fr;min-height:100vh}
aside{background:var(--navy);color:var(--chalk);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.brand{padding:26px 24px 20px;border-bottom:1px solid var(--navy-3);display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.crest{width:46px;height:46px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-weight:700;color:var(--gold);font-size:17px;letter-spacing:.02em}
.brand h1{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.1;color:var(--white)}
.brand p{font-size:13px;color:var(--dim);margin-top:3px}
.search{padding:14px 24px;border-bottom:1px solid var(--navy-3)}
.search input{width:100%;background:var(--navy-2);border:1px solid var(--navy-3);border-radius:8px;padding:9px 12px;color:var(--white)}
.search input::placeholder{color:#8794ad}
.progress-mini{padding:12px 24px;border-bottom:1px solid var(--navy-3);font-size:13px;color:var(--dim)}
.progress-mini .bar{height:5px;background:var(--navy-3);border-radius:3px;margin-top:6px;overflow:hidden}
.progress-mini .bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
nav{overflow-y:auto;flex:1;padding:6px 0 24px}
.home-link{display:block;width:100%;text-align:left;background:none;border:0;color:var(--chalk);padding:12px 24px 8px;cursor:pointer;font-size:14.5px;font-weight:600}
.home-link:hover{color:var(--gold)}
details.part{margin-top:2px}
details.part summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px 1fr auto;align-items:baseline;gap:8px;padding:9px 24px;font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--white)}
details.part summary::-webkit-details-marker{display:none}
details.part summary b{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--navy);background:var(--dim);border-radius:4px;text-align:center;padding:1px 0}
details.part[open] summary b{background:var(--gold)}
details.part summary small{font-family:var(--sans);font-size:12px;font-weight:400;color:var(--dim)}
details.part summary:hover{background:var(--navy-2)}
nav ol{list-style:none;padding:2px 0 8px}
nav li button{display:grid;grid-template-columns:30px 1fr 16px;gap:6px;width:100%;text-align:left;background:none;border:0;color:#c9d1df;padding:6px 20px 6px 40px;cursor:pointer;font-size:14px;line-height:1.35}
nav li button span:first-child{color:var(--dim);font-variant-numeric:tabular-nums}
nav li button:hover{background:var(--navy-2);color:var(--white)}
nav li button[aria-current="true"]{background:var(--navy-3);color:var(--white);box-shadow:inset 3px 0 0 var(--gold)}
nav li button .ck{color:var(--gold);font-size:12px}
.empty{padding:16px 24px;color:var(--dim);font-size:14px}

.scrim{display:none}
main{min-width:0;grid-column:2}
.topbar{display:none}
.wrap{max-width:800px;margin:0 auto;padding:48px 32px 90px}

/* home */
.hero{border-bottom:1px solid var(--rule);padding-bottom:30px;margin-bottom:10px}
.hero h2{font-family:var(--serif);font-size:48px;font-weight:600;line-height:1.05;letter-spacing:-.01em;color:var(--navy);margin-bottom:18px;max-width:17ch}
.hero p{font-size:17.5px;max-width:62ch;margin-bottom:12px;color:#2b3446}
.hero .exchange{margin:26px 0 6px;max-width:560px}
.sec{font-family:var(--serif);font-size:30px;font-weight:600;margin:40px 0 6px;color:var(--navy)}
.sub{color:var(--muted);max-width:62ch;margin-bottom:14px}
.steps{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:18px 0 8px;border:1px solid var(--rule);border-radius:10px;background:var(--white);overflow:hidden}
.steps li{padding:16px 18px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.steps li:nth-child(3n){border-right:0}
.steps li:nth-last-child(-n+3){border-bottom:0}
.steps b{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy)}
.steps b i{font-style:normal;font-family:var(--sans);font-size:13px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center}
.steps span{display:block;font-size:14px;color:var(--muted);margin-top:4px;line-height:1.4}
.parts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:16px}
.parts-grid button{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:16px 16px 14px;cursor:pointer;position:relative;overflow:hidden}
.parts-grid button::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--part)}
.parts-grid button:hover{border-color:var(--part)}
.parts-grid .pn{font-size:13px;font-weight:700;color:var(--part)}
.parts-grid strong{font-family:var(--serif);font-size:20px;line-height:1.15;color:var(--ink)}
.parts-grid .pd{font-size:14px;color:var(--muted);line-height:1.4}
.parts-grid .pc{font-size:13px;color:var(--part);font-weight:600;margin-top:auto;padding-top:6px}
.toc{columns:2 300px;column-gap:30px;margin:14px 0 30px}
.toc section{break-inside:avoid;margin-bottom:22px}
.toc h4{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:4px;color:var(--part);padding-bottom:5px;border-bottom:2px solid var(--part)}
.toc ol{list-style:none}
.toc button{display:grid;grid-template-columns:32px 1fr auto;width:100%;text-align:left;background:none;border:0;padding:4px 0;cursor:pointer;font-size:15px;color:var(--ink);gap:4px}
.toc button span:first-child{color:var(--part);font-variant-numeric:tabular-nums;font-weight:600}
.toc button:hover{color:var(--part)}
.toc .ck{color:var(--gold);font-size:13px}
.notice{background:var(--white);border:1px solid var(--rule);border-left:4px solid var(--gold);padding:18px 20px;margin:22px 0;border-radius:0 8px 8px 0}
.notice h3{font-size:16px;margin-bottom:6px}
.notice p{font-size:15px;color:var(--muted)}
.resetrow{font-size:14px;color:var(--muted);margin-top:8px}
.linkbtn{background:none;border:0;color:var(--part);text-decoration:underline;cursor:pointer;padding:0}

/* script page */
.plate{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start;margin-bottom:24px}
.num{width:92px;height:92px;border-radius:12px;background:var(--part);color:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.num small{font-size:11.5px;font-weight:600;opacity:.8}
.num b{font-family:var(--serif);font-size:40px;line-height:1;font-weight:600}
.partname{font-size:14px;font-weight:600;color:var(--part)}
.script h2{font-family:var(--serif);font-size:38px;font-weight:600;line-height:1.1;margin:4px 0 10px;color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{font-size:13px;border:1px solid var(--rule);background:var(--white);border-radius:999px;padding:3px 10px;color:var(--muted)}
.facts span.kind{border-color:color-mix(in srgb,var(--part) 35%,#fff);color:var(--part);background:color-mix(in srgb,var(--part) 7%,#fff);font-weight:600}

.rounds{display:grid;grid-template-columns:repeat(6,1fr);list-style:none;margin:0 0 -1px;position:relative;z-index:1}
.rounds button{width:100%;background:transparent;border:1px solid transparent;border-bottom:0;border-radius:10px 10px 0 0;padding:10px 6px 11px;cursor:pointer;font-size:13px;line-height:1.25;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.rounds button i{font-style:normal;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--white)}
.rounds button:hover{color:var(--part)}
.rounds button.done i{background:var(--part);border-color:var(--part);color:var(--white)}
.rounds button[aria-current="step"]{background:var(--white);border-color:var(--rule);color:var(--ink);font-weight:600}
.rounds button[aria-current="step"] i{border-color:var(--part);color:var(--part);background:var(--white);box-shadow:0 0 0 3px color-mix(in srgb,var(--part) 18%,#fff)}
.panel{background:var(--white);border:1px solid var(--rule);border-radius:0 0 12px 12px;padding:24px 26px 22px}
.panel h3{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.1;margin-bottom:6px;color:var(--part)}
.panel .hint{font-size:15.5px;color:var(--muted);margin-bottom:16px;max-width:64ch}

/* player */
.deck{border:1px solid var(--rule);border-radius:10px;background:#f8f9fb;padding:14px 16px;margin-bottom:14px}
.deck-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.deck-row+.deck-row{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.btn{background:var(--part);color:var(--white);border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;font-size:15px}
.btn:hover{filter:brightness(.9)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.secondary{background:var(--white);color:var(--part);border:1px solid var(--rule)}
.btn.secondary:hover{border-color:var(--part);background:color-mix(in srgb,var(--part) 6%,#fff)}
.btn.big{padding:11px 20px;min-width:128px}
.btn.gold{background:var(--navy);color:var(--gold)}
.deck label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.deck select{border:1px solid var(--rule);border-radius:6px;padding:6px 8px;background:var(--white);max-width:210px;font-size:14px}
.deck .sp{margin-left:auto}
.nowline{font-size:14px;color:var(--muted);flex:1;min-width:180px}
.nowline b{color:var(--ink)}
.track{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:10px}
.track i{display:block;height:100%;width:0;background:var(--part);transition:width .2s}
.voice-note{font-size:13px;color:var(--muted);margin:2px 0 16px}
.recording audio{width:100%;margin-bottom:6px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);cursor:pointer}
.check input{accent-color:var(--part);width:17px;height:17px}

/* transcript as a dialogue script */
.dlg{margin-top:6px;border-top:1px solid var(--rule)}
.turn{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid #eceef2}
.who{font-size:13px;font-weight:700;padding-top:4px}
.turn.P .who{color:var(--part)}
.turn.S .who{color:#4d5a70}
.turn.S .say{background:#f3f5f8;border-radius:10px;padding:8px 12px;margin-left:-12px}
.say{font-family:var(--serif);font-size:18.5px;line-height:1.7}
.seg{border-radius:4px;transition:background .15s;cursor:pointer}
.seg:hover{background:color-mix(in srgb,var(--part) 8%,transparent)}
.seg.on{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold-soft)}
.masked{border:1px dashed #b9c1ce;border-radius:10px;padding:22px 24px;color:var(--muted);font-size:15px;background:#fafbfc}
.masked .turns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.masked .turns span{font-size:12.5px;font-weight:700;border-radius:4px;padding:3px 8px;background:var(--white);border:1px solid var(--rule)}
.masked .turns span.P{color:var(--part)}
.masked .turns span.on{background:var(--gold-soft);border-color:var(--gold)}

.field{margin-top:14px}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.field input{width:100%;max-width:360px;border:1px solid var(--rule);border-radius:8px;padding:9px 12px;background:var(--white)}
textarea{width:100%;min-height:210px;border:1px solid var(--rule);border-radius:10px;padding:14px 16px;background:var(--white);font-size:17px;line-height:1.6;resize:vertical}
textarea.short{min-height:100px}
textarea:focus,.field input:focus{border-color:var(--part);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--part) 15%,#fff)}
.prompts{list-style:none;margin:6px 0 4px;display:grid;gap:6px}
.prompts li{font-size:15px;padding-left:18px;position:relative}
.prompts li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.nextrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}

.result{margin-top:22px;border:1px solid var(--rule);border-radius:10px;padding:20px 22px;background:#fbfbfc}
.score{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1;color:var(--part)}
.score small{font-family:var(--sans);font-size:15px;font-weight:400;color:var(--muted);margin-left:8px}
.legend{font-size:14px;color:var(--muted);margin:12px 0}
.legend mark,.legend del{padding:0 4px}
.diff{font-size:17px;line-height:1.9;font-family:var(--serif)}
mark{background:var(--missed);color:var(--missed-ink);border-radius:3px;padding:0 2px}
mark.small{outline:2px solid #c98a1a;outline-offset:-1px}
del{color:var(--extra);text-decoration:line-through}
.smalls{margin-top:14px;font-size:15px}
.rest{color:#9aa1a8}
.sendbox{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.sendbox p{font-size:14px;color:var(--muted);margin-top:8px}
.status{font-size:14px;color:var(--part);margin-top:8px;min-height:1.2em}
.done-banner{margin-top:16px;display:flex;gap:12px;align-items:center;background:var(--gold-soft);border:1px solid #e8d49f;border-radius:10px;padding:12px 16px;font-size:15px}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:22px;border-top:1px solid var(--rule)}
.pager button{background:none;border:0;cursor:pointer;text-align:left;max-width:48%;padding:4px 0}
.pager button:last-child{text-align:right;margin-left:auto}
.pager small{display:block;font-size:13px;color:var(--muted)}
.pager span{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink)}
.pager button:hover span{color:var(--part)}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  main{grid-column:1}
  aside{position:fixed;inset:0 auto 0 0;width:min(340px,88vw);z-index:30;transform:translateX(-100%);transition:transform .2s ease}
  aside.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,18,32,.45);z-index:20;display:none}
  .scrim.open{display:block}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;background:var(--navy);color:var(--white);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .topbar button{background:var(--navy-3);color:var(--white);border:0;border-radius:6px;padding:8px 12px;cursor:pointer}
  .topbar strong{font-family:var(--serif);font-size:19px;font-weight:600}
  .wrap{padding:26px 16px 70px}
  .hero h2{font-size:36px}
  .script h2{font-size:29px}
  .plate{grid-template-columns:1fr;gap:12px}
  .num{width:70px;height:70px}.num b{font-size:30px}
  .rounds{grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}
  .rounds button{border:1px solid var(--rule);border-radius:8px;background:var(--white)}
  .panel{border-radius:12px;padding:18px 16px}
  .steps{grid-template-columns:1fr}
  .steps li{border-right:0!important;border-bottom:1px solid var(--rule)!important}
  .steps li:last-child{border-bottom:0!important}
  .turn{grid-template-columns:1fr;gap:2px}
  .turn.S .say{margin-left:0}
  .say{font-size:17.5px}
  .deck .sp{margin-left:0}
}
@media (prefers-reduced-motion: reduce){aside,.track i,.seg{transition:none}}
@media print{
  aside,.topbar,.deck,.voice-note,.rounds,.pager,.nextrow,.actions,textarea,.field{display:none!important}
  .shell{display:block}.panel{border:0;padding:0}
}

.setting{font-size:15px;color:var(--muted);margin:-4px 0 10px}
.setting b{color:var(--ink);font-weight:600}
.star{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:10px;background:var(--white);overflow:hidden;margin:16px 0 10px}
.star li{padding:16px 16px 14px;border-right:1px solid var(--rule)}
.star li:last-child{border-right:0}
.star b{display:block;font-family:var(--serif);font-size:30px;line-height:1;color:var(--gold)}
.star strong{display:block;font-family:var(--serif);font-size:19px;color:var(--navy);margin-top:6px}
.star em{display:block;font-style:normal;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:2px}
.star span{display:block;font-size:14px;color:var(--muted);margin-top:6px;line-height:1.4}
.star li.act{background:var(--gold-soft)}
.pitfalls{list-style:none;display:grid;gap:10px;margin:14px 0 6px}
.pitfalls li{background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:12px 16px;font-size:15px}
.pitfalls li b{color:var(--navy)}
.formula{counter-reset:f;list-style:none;display:grid;gap:10px;margin:14px 0}
.formula li{counter-increment:f;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;font-size:15.5px}
.formula li::before{content:counter(f);width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:14px}
.coach{margin-top:18px;background:var(--gold-soft);border:1px solid #edcfb2;border-radius:10px;padding:16px 18px}
.coach h4{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy);margin-bottom:4px}
.coach p{font-size:15.5px;color:#3a3a33}
.mine{margin-top:22px;padding-top:18px;border-top:1px solid var(--rule)}
.mine h4{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--part);margin-bottom:4px}
@media (max-width:900px){.star{grid-template-columns:1fr 1fr}.star li:nth-child(2){border-right:0}.star li:nth-child(-n+2){border-bottom:1px solid var(--rule)}}
.scene{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--muted);margin:-2px 0 10px;max-width:62ch}
.listenfor{margin-top:18px;background:var(--gold-soft);border:1px solid #bfe0dc;border-radius:10px;padding:16px 18px}
.listenfor h4{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy);margin-bottom:4px}
.listenfor p{font-size:15.5px;color:#2d3a38}
.listenfor p+p{margin-top:6px}
.respond{margin-top:22px}
.respond h4{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--navy);margin-bottom:4px}
.rsp{border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin-top:12px;background:var(--white)}
.rsit{font-size:14.5px;color:#55615f}
.rq{font-size:17px;margin:6px 0 10px}
.rsp .field{margin-bottom:10px}
.model{margin-top:10px;background:var(--gold-soft);border-radius:8px;padding:10px 12px;font-size:16px}
.model span{display:block;font-size:13.5px;color:#55615f;margin-top:4px}
.startlist{list-style:none;display:grid;gap:8px;margin:14px 0 8px}
.startlist button{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--white);border:1px solid var(--rule);border-radius:10px;padding:12px 16px;cursor:pointer;font:inherit;color:var(--ink)}
.startlist button:hover{border-color:var(--gold)}
.startlist .n{width:32px;height:32px;border-radius:8px;background:var(--gold);color:#fff;display:grid;place-items:center;font-weight:700;font-variant-numeric:lining-nums}
.startlist b{display:block;font-family:var(--serif);font-size:18px}
.startlist small{color:var(--muted);font-size:13.5px}
.startlist .lv{font-size:12.5px;font-weight:700;color:var(--gold);text-align:right}
.startlist .ck{color:var(--gold);font-weight:700}
.cta{background:var(--navy);color:var(--chalk);border-radius:12px;padding:24px 26px;margin:34px 0 22px}
.cta h3{font-family:var(--serif);font-size:26px;font-weight:600;color:var(--white);margin-bottom:8px;line-height:1.2}
.cta p{font-size:16px;line-height:1.55;color:#d6dbe4;max-width:62ch}
.cta p+p{margin-top:8px}
.cta .ctarow{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.cta a.btn{display:inline-block;text-decoration:none}
.cta a.btn.gold{background:var(--gold);color:var(--navy)}
.cta a.btn.secondary{background:transparent;color:var(--white);border:1px solid #6b7486}
@media print{.cta{display:none!important}}
</style>
</head>

me for coffee on Saturday?", "I'd love to, thanks! What time is good for you?"]]}, {"num": 2, "title": "The Phone Call", "lines": [["P", "Is the shop far?", "Jenny"], ["S", "It isn't far. I can walk there in fifteen minutes.", "Tim"], ["P", "Is the pay good?", "Jenny"], ["S", "It is. It's better than my last job.", "Tim"], ["P", "Does it have benefits?", "Jenny"], ["S", "It does. Dental and medical, after three months.", "Tim"], ["P", "So why are you so nervous?", "Jenny"], ["S", "Because my manager, Linda, wasn't there when I picked up my uniform. Her assistant said she was at a meeting in the morning, and then at the dentist. He said she'll call me tonight about my schedule.", "Tim"], ["P", "What time will she call?", "Jenny"], ["S", "He wasn't sure. Maybe around eight. And it's eight thirty now.", "Tim"], ["P", "She will call. Relax.", "Jenny"], ["S", "I can't relax. Maybe she won't call. Maybe she forgot. What if the job isn't mine anymore?", "Tim"], ["P", "Tim, it is your job. They gave you a uniform!", "Jenny"], ["P", "Hi, Tim, it's Linda. Sorry I'm so late. It was a crazy day. Can you talk now?", "Linda"], ["S", "I can, yes.", "Tim"], ["P", "Great. Can you start at eight tomorrow, not nine? We're very busy this week.", "Linda"], ["S", "I can.", "Tim"], ["P", "Is that a problem?", "Linda"], ["S", "No, it isn't. That's fine.", "Tim"], ["P", "Good. One more thing. You won't work on Saturdays this month, but you will work Saturdays in December. Is that okay?", "Linda"], ["S", "That's okay. It wasn't a problem at my last job either.", "Tim"], ["P", "Can you bring your own tools?", "Linda"], ["S", "I can. They're all in my car.", "Tim"], ["P", "Perfect. See you at eight. Don't be late. The boss is always here at seven thirty.", "Linda"], ["S", "Who's the boss?", "Tim"], ["P", "My husband. He's never late, and he won't let you forget it.", "Linda"], ["P", "Well? Was it good news?", "Jenny"], ["S", "It was. I can't wait.", "Tim"]], "words": 259, "kind": "story", "scene": "It's the night before Tim's first day at a car repair shop on Kingsway. He's at home with his wife, Jenny, waiting for a phone call.", "F": "is/isn't, was/wasn't, can/can't, will/won't", "V": "", "t": [[2.0, 3.15], [3.82, 4.7], [4.92, 6.62], [7.29, 8.34], [9.01, 9.67], [9.89, 11.43], [12.1, 13.4], [14.07, 14.71], [14.93, 16.93], [17.6, 19.07], [19.74, 23.73], [23.95, 28.26], [28.48, 30.79], [31.46, 32.8], [33.47, 34.39], [34.61, 35.65], [35.87, 36.96], [37.63, 38.55], [38.77, 39.6], [40.27, 41.23], [41.45, 42.54], [42.76, 43.8], [44.02, 45.88], [46.55, 47.96], [48.18, 49.69], [50.36, 51.71], [51.93, 53.21], [53.43, 54.6], [54.82, 55.95], [56.62, 57.52], [58.19, 58.89], [59.11, 61.37], [61.59, 62.89], [63.56, 64.25], [64.92, 66.07], [66.74, 67.66], [67.88, 68.64], [69.31, 69.89], [70.11, 71.07], [71.29, 75.34], [75.56, 76.57], [77.24, 78.07], [78.29, 80.63], [81.3, 82.67], [83.34, 84.02], [84.24, 85.39], [86.06, 86.83], [87.05, 88.03], [88.25, 89.17], [89.39, 91.63], [92.3, 93.2], [93.87, 94.78], [95.0, 97.39], [98.06, 98.68], [98.9, 99.99], [100.66, 101.3], [101.52, 102.35]], "R": [["Your new boss calls the night before your first day.", "Manager", "Can you start at seven thirty tomorrow?", "Yes, seven thirty is fine. Where should I go when I arrive?"], ["Your manager gives you information on the phone.", "Manager", "Park behind the building and come to the side door.", "Okay. Behind the building, side door. Thanks, see you tomorrow!"]]}]}, {"part": 2, "title": "Immigration and Settling In", "desc": "From Express Entry to citizenship, and the paperwork of the first year.", "scripts": [{"num": 17, "title": "First Week in Vancouver", "lines": [["P", "Sorry I'm late. I was at the phone store on Broadway until eleven.", "Bruno"], ["S", "That's okay. I bought a coffee for you and a sandwich for me. Did you get a phone plan?", "Carla"], ["P", "I did. It's forty dollars a month. I got one for you too.", "Bruno"], ["S", "Thank you! Did you get the internet for the apartment too?", "Carla"], ["P", "Not yet. They can't install it until next Tuesday. How was the bank?", "Bruno"], ["S", "Good. I went at nine o'clock in the morning, and I stayed until ten thirty. The woman at the desk, Helen, was very friendly. She asked how long I've been in Canada.", "Carla"], ["P", "What did you say?", "Bruno"], ["S", "I said, \"For three weeks. I arrived on January 5th.\" Then she asked for a letter from my employer. I didn't have it.", "Carla"], ["P", "Oh no.", "Bruno"], ["S", "It's fine. She said I can bring it by Friday. They're open until five. She also asked if I want a credit card too.", "Carla"], ["P", "Do you?", "Bruno"], ["S", "Not today. Maybe next month.", "Carla"], ["P", "It's so cold today. It was minus five this morning. In Recife, it's thirty degrees right now.", "Bruno"], ["S", "You've complained about the weather since the day you arrived.", "Carla"], ["P", "That's because it's been cold since the day I arrived. I came in December, remember? I've been here for two months.", "Bruno"], ["S", "Wait until February. It rains every day too.", "Carla"], ["P", "Then I'm going back to Brazil for February.", "Bruno"]], "words": 225, "kind": "story", "scene": "Carla is from Recife. She arrived in Vancouver three weeks ago. After a morning at the bank, she meets her husband, Bruno, at a café on Main Street.", "F": "to/for, to/too, for/since, in/on/at, by/until, from/since", "V": "", "t": [[2.0, 2.96], [3.18, 6.02], [6.69, 7.6], [7.82, 10.41], [10.63, 11.97], [12.64, 13.26], [13.48, 14.82], [15.04, 16.3], [16.97, 17.72], [17.94, 20.43], [21.1, 21.83], [22.05, 24.12], [24.34, 25.28], [25.95, 26.48], [26.7, 30.8], [31.02, 33.62], [33.84, 35.87], [36.54, 37.41], [38.08, 39.51], [39.73, 41.52], [41.74, 44.0], [44.22, 45.18], [45.85, 46.51], [47.18, 47.95], [48.17, 50.11], [50.33, 51.89], [52.11, 54.82], [55.49, 56.17], [56.84, 57.74], [57.96, 59.11], [59.78, 60.98], [61.2, 62.73], [62.95, 65.32], [65.99, 69.13], [69.8, 72.4], [72.62, 74.11], [74.33, 75.72], [76.39, 77.78], [78.0, 79.51], [80.18, 82.55]], "R": [["A friend asks about your first week in Vancouver.", "Friend", "So, how's your first week going?", "It's good, but tiring. I opened a bank account today. Tomorrow, I'm getting my SIN."], ["Someone asks what you think of the city.", "Friend", "Do you like Vancouver so far?", "Yes, I love the mountains. But the rain is taking some time to get used to!"]]}]}];
const PILOT = [{"num": 1, "level": "Level 1: Hear the small words"}, {"num": 2, "level": "Level 1: Hear the small words"}, {"num": 17, "level": "Level 1: Hear the small words"}];
const PART_DESC = {"1": "Short stories built around the small words Brazilians often miss when listening.", "2": "From Express Entry to citizenship, and the paperwork of the first year.", "3": "SkyTrain, directions, and getting a B.C. driver's licence.", "4": "Tours, day trips, and a night at the hockey game.", "5": "Groceries, stores, malls, and eating out.", "6": "Clinics, emergencies, and staying safe in B.C.", "7": "Daycare, school, neighbours, and holidays.", "8": "The conversations and unwritten rules nobody explains.", "9": "Registration, assignments, professors, and group projects.", "10": "The job search, from the first application to the first pay stub.", "11": "Everyday life at work.", "12": "Safety, measurements, and site vocabulary.", "13": "Fictional meetings set at well-known Vancouver organizations."};
const TEACHER_EMAIL = "executiveclass.ca@gmail.com";
/* ===== RECORDINGS ===========================================================
   MP3 files live in the "audio" folder beside this page, named by script
   number: audio/Story-001.mp3 ... audio/Story-100.mp3. Each script in BOOK has
   "t": the start and end time of every sentence, so students can replay one
   sentence at a time and follow the highlighted text in sync.
   If a recording is missing, the lab falls back to the device's voices.      */
const AUDIO_BASE = "audio/";
const AUDIO_EXT = ".mp3";

const SMALL = new Set("a an the to too for since from by until at in on of do does did don't doesn't didn't is isn't was wasn't were weren't are aren't am can can't could couldn't will won't would wouldn't should shouldn't have has had haven't hasn't hadn't been be he she him her they them we us it its it's that than then this these those there their they're you your you're i i'm i'd i'll i've me my and or but if so not no as with".split(" "));
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WHO = { P: "Voice 1", S: "Voice 2" };
const ALL = [];

const byNum = n => ALL.find(s => s.num === n);
const minutes = w => { const m = w / 140; return m < 1.25 ? "about 1 minute" : `about ${Math.round(m * 2) / 2} minutes`.replace(".5", "½"); };
const fullText = s => s.lines.map(l => l[1]).join(" ");
function sentencesOf(text) { return text.replace(/\s+/g, " ").replace(/\b(Mrs|Mr|Dr)\. /g, "$1§ ").match(/[^.!?]+[.!?]+["”’')]*(\s|$)|[^.!?]+$/g)?.map(x => x.trim().replace(/§/g, ".")).filter(Boolean) || [text]; }
function segsOf(s) { const out = []; s.lines.forEach((l, ti) => sentencesOf(l[1]).forEach(t => out.push({ sp: l[0], t, turn: ti, name: l[2] }))); return out; }

/* local progress (this browser only) */
const store = {
  get(k, d) { try { const v = localStorage.getItem("lls:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("lls:" + k, JSON.stringify(v)); } catch {} }
};
let DONE = new Set(store.get("done", []));
const markDone = n => { DONE.add(n); store.set("done", [...DONE]); renderProgress(); };

/* recordings */
const audioUrl = n => `${AUDIO_BASE}Story-${String(n).padStart(3, "0")}${AUDIO_EXT}`;
const audioCache = {};
function checkAudio(n) {
  if (n in audioCache) return Promise.resolve(audioCache[n]);
  return new Promise(res => {
    const a = new Audio(), done = ok => { audioCache[n] = ok; res(ok); };
    a.addEventListener("loadedmetadata", () => done(true), { once: true });
    a.addEventListener("error", () => done(false), { once: true });
    a.preload = "metadata"; a.src = audioUrl(n);
    setTimeout(() => { if (!(n in audioCache)) done(false); }, 4000);
  });
}

/* ---------- navigation ---------- */
function renderProgress() {
  const n = DONE.size, pct = Math.round(n / ALL.length * 100);
  $("#progMini").innerHTML = `${n} of ${ALL.length} stories completed<div class="bar"><i style="width:${pct}%"></i></div>`;
}
function renderNav(filter = "") {
  const f = filter.trim().toLowerCase();
  const cur = location.hash.startsWith("#script-") ? +location.hash.slice(8) : null;
  const curPart = cur ? (byNum(cur) || {}).part : null;
  let html = `<button class="home-link" data-home>About these stories</button>`, any = false;
  BOOK.forEach(p => {
    const items = p.scripts.filter(s => !f || (s.title + " " + p.title + " " + fullText(s)).toLowerCase().includes(f));
    if (!items.length) return; any = true;
    const open = f || p.part === curPart || (!cur && p.part === 1);
    html += `<details class="part" ${open ? "open" : ""}><summary><b>${p.part}</b><span>${esc(p.title)}</span><small>${items.length}</small></summary><ol>` +
      items.map(s => `<li><button data-script="${s.num}" ${s.num === cur ? 'aria-current="true"' : ''}><span>${s.num}</span><span>${esc(s.title)}</span><span class="ck">${DONE.has(s.num) ? "✓" : ""}</span></button></li>`).join("") + `</ol></details>`;
  });
  if (!any) html += `<p class="empty">No stories match “${esc(filter)}”. Try one word, like “bank” or “school”.</p>`;
  $("#nav").innerHTML = html;
  const c = $('nav [aria-current="true"]'); if (c && !f) c.scrollIntoView({ block: "nearest" });
}

const CTA = () => `<div class="cta">
      <h3>${DONE.size >= ALL.length ? "You've finished the free sample." : "Like the sample? There's much more."}</h3>
      <p>The full Listening Lab has 100 stories about life in Vancouver: the bank, the doctor, school, work, and the neighbours. Every Executive Class course also includes a specialized lab for your goal: the office, job interviews, networking, or university.</p>
      <p>Every course begins with a two-hour Preboarding Assessment, credited in full toward your course.</p>
      <div class="ctarow"><a class="btn gold" href="https://executiveclass.ca/#aplicar" target="_blank" rel="noopener">Book your Preboarding Assessment</a><a class="btn secondary" href="https://executiveclass.ca/#cursos" target="_blank" rel="noopener">See the courses</a></div>
    </div>`;
const ROUNDS = [
  ["Listen", "Hear the whole conversation once and follow the story."],
  ["Transcribe", "Write what you hear, one sentence at a time."],
  ["Listen again", "Play it from the start and fix your transcription."],
  ["Compare", "Check your words against the text and see what you missed."],
  ["Shadow", "Read along with the recording, then say it with the speakers."],
  ["Retell", "Take one person's part, retell the story, then respond in your own words."]
];

function renderHome() {
  stopAll();
  delete document.body.dataset.part;
  $("#view").innerHTML = `<section>
    <div class="hero">
      <h2>Hear the words you know but don't hear</h2>
      <p>Many Brazilian professionals can read English easily but miss words when Canadians speak naturally. Often the missing words are the small ones: <i>do, does, did, didn't, to, for, since, can, can't</i>, and <i>-ed</i> endings.</p>
      <p>This free sample has 3 stories from the full Listening Lab. Each one is a real conversation, recorded with a different voice for each person, about everyday life in Vancouver. The language is everyday English, so you can focus on the real challenge: hearing it.</p>
      <div class="exchange dlg" data-part="1">
        <div class="turn P"><div class="who">Tom</div><div class="say">So, do you know Doug?</div></div>

/* ---------- script page ---------- */
let ST = null;
const PREF = Object.assign({ rate: "0.9", pv: "", sv: "", arate: "1", gap: "1.4" }, store.get("pref", {}));
const savePref = () => store.set("pref", PREF);

  const prev = ALL[i - 1], next = ALL[i + 1];
  const turns = s.lines.length;
  $("#view").innerHTML = `<article class="script" data-part="${s.part}">
    <div class="plate">
      <div class="num" aria-hidden="true"><small>Story</small><b>${s.num}</b></div>
      <div>
        <p class="partname">Part ${s.part}: ${esc(s.partTitle)}</p>
        <h2>${esc(s.title)}</h2>
        <p class="scene">${esc(s.scene)}</p>
        <div class="facts"><span class="kind">Conversation</span><span>${s.words} words</span><span>${minutes(s.words)}</span>${DONE.has(s.num) ? `<span>✓ Completed</span>` : ""}</div>
      </div>
    </div>
    <ol class="rounds" aria-label="Rounds">${ROUNDS.map((r, k) => `<li><button data-round="${k}" ${k === ST.round ? 'aria-current="step"' : ''} class="${ST.done.has(k) ? 'done' : ''}"><i>${ST.done.has(k) && k !== ST.round ? "✓" : k + 1}</i>${r[0]}</button></li>`).join("")}</ol>
    <div class="panel" id="panel"></div>
    <div class="pager">
      ${prev ? `<button data-script="${prev.num}"><small>Previous</small><span>${prev.num}. ${esc(prev.title)}</span></button>` : "<span></span>"}
      ${next ? `<button data-script="${next.num}"><small>Next</small><span>${next.num}. ${esc(next.title)}</span></button>` : ""}
    </div>
    ${next ? "" : CTA()}
  </article>`;
  document.querySelectorAll("[data-round]").forEach(b => b.onclick = () => goRound(+b.dataset.round));
  renderPanel(s);
  checkAudio(s.num).then(ok => { if (ok && !ST.hasAudio && ST.num === s.num) { ST.hasAudio = true; renderPanel(s); } });
}
function goRound(k) { saveFields(); stopAll(); ST.done.add(ST.round); ST.round = k; renderScript(ST.num); const r = document.querySelector(".rounds"); window.scrollTo({ top: r.getBoundingClientRect().top + scrollY - 70 }); }
function saveFields() { const g = $("#gist"), a = $("#answer"), nm = $("#sname"); if (g) ST.gist = g.value; if (a) ST.answer = a.value; if (nm) { ST.name = nm.value; store.set("name", nm.value); } }

function dialogueHTML(s, showText) {
  let k = 0;
  if (!showText) return `<div class="masked">The text is hidden in this round so you listen, not read.
      <div class="turns">${s.lines.map((l, ti) => `<span class="${l[0]}" data-turn="${ti}">${esc(l[2])}</span>`).join("")}</div></div>`;
  return `<div class="dlg">${s.lines.map((l, ti) => `<div class="turn ${l[0]}"><div class="who">${esc(l[2])}</div><div class="say">${sentencesOf(l[1]).map(t => `<span class="seg" data-seg="${k++}">${esc(t)}</span>`).join(" ")}</div></div>`).join("")}</div>`;
}

function playerHTML(opts) {
  const { lines = false, echo = false } = opts || {};
  const S = ALL.find(x => x.num === ST.num), dlg = true, rec = ST.hasAudio;
  return `<div class="deck">
      <div class="deck-row">
        <button class="btn big" id="play">Play</button>
        <button class="btn secondary" id="stop">Stop</button>
        <span class="nowline" id="nowline" aria-live="polite">Ready. ${ST.segs.length} sentences.</span>
      </div>
      ${lines ? `<div class="deck-row"><button class="btn secondary" id="sprev">Previous sentence</button><button class="btn" id="splay"></button><button class="btn secondary" id="snext">Next sentence</button></div>` : ""}
      ${echo ? `<div class="deck-row"><label>Pause after each sentence <select id="gap"><option value="1">Short</option><option value="1.4">Medium</option><option value="2">Long</option></select></label>${dlg ? `<label class="check"><input type="checkbox" id="roleplay" ${ST.roleplay ? "checked" : ""}> I'll say ${esc(roleName())}'s lines</label>` : ""}</div>` : ""}
      <div class="deck-row">
        ${rec ? `<button class="btn secondary" id="back10">Back 10 seconds</button><span class="nowline">Recorded voices, a different one for each person.</span>` : `<label>Voice 1 <select id="pv"></select></label><label>Voice 2 <select id="sv"></select></label>`}
        <label class="sp">Speed <select id="${rec ? "arate" : "rate"}">${rec ? `<option value="0.75">Slow</option><option value="0.9">A little slow</option><option value="1">Natural</option>` : `<option value="0.65">Very slow</option><option value="0.8">Slow</option><option value="0.9">A little slow</option><option value="1">Natural</option>`}</select></label>
      </div>
      <div class="track"><i id="trk"></i></div>
    </div>
    ${rec ? "" : `<p class="voice-note">The recording didn't load, so these are your device's voices. Voices marked ★ sound the most natural.</p>`}`;
}

/* ---------- speech engine ---------- */
let voices = [], RUN = 0;
/* Voice quality: Safari and macOS list many novelty and old robotic voices
   (Fred, Albert, Zarvox, Eddy, Grandpa...). Hide them, and rank the natural
   "Premium" / "Enhanced" voices first. */
const NOVELTY = /\b(albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|pipe organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|kathy|princess|eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley|agnes|bruce|vicki|victoria)\b/i;
const FEMALE = /female|samantha|ava|zoe|allison|susan|nicky|karen|moira|tessa|serena|kate|stephanie|fiona|catherine|martha|aria|jenny|zira|libby|sonia|natasha|clara|emma|michelle|joanna|kendra|salli|hazel|ruth|isla|evie|google us english|google uk english female/i;
const MALE = /\bmale\b|alex|aaron|evan|nathan|tom|daniel|oliver|arthur|lee|gordon|rishi|guy|christopher|eric|andrew|brian|roger|ryan|liam|william|david|mark|matthew|james|thomas|noah|jamie/i;
const GOOD = /samantha|alex|ava|zoe|allison|susan|evan|nathan|tom|daniel|karen|moira|tessa|serena|kate|oliver|arthur|jenny|aria|guy|libby|sonia|ryan|clara|liam|natural|neural|google/i;
const gender = v => FEMALE.test(v.name) && !/\bmale\b/i.test(v.name) ? "F" : MALE.test(v.name) ? "M" : "?";
function quality(v) {
  const n = v.name;
  return (/premium/i.test(n) ? 60 : 0) + (/enhanced/i.test(n) ? 45 : 0) + (/natural|neural|online/i.test(n) ? 40 : 0) +
    (GOOD.test(n) ? 20 : 0) + ({ "en-CA": 6, "en-US": 5, "en-GB": 3 }[v.lang] || 1) + (v.default ? 2 : 0);
}
const label = v => v.name.replace(/^Microsoft |^Google /, "").replace(/ Online \(Natural\)/, " (natural)") + " · " + v.lang.slice(3) + (quality(v) >= 45 ? "  ★" : "");
function loadVoices() {
  if (!("speechSynthesis" in window)) return [];
  const all = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("en"));
  voices = all.filter(v => !NOVELTY.test(v.name));
  if (!voices.length) voices = all;
  voices.sort((a, b) => quality(b) - quality(a) || a.name.localeCompare(b.name));
  return voices;
}
function defaultVoices() {
  if (!voices.length) return ["", ""];
  const p = PREF.pv && voices.find(v => v.name === PREF.pv) || voices[0];
  const best = voices[0] && quality(voices[0]);
  // second voice: best voice that isn't the first one's; prefer the other gender if it's nearly as good
  const others = voices.filter(v => v !== p);
  const opp = others.find(v => gender(v) !== "?" && gender(v) !== gender(p) && quality(v) >= quality(others[0] || p) - 25);
  const s = PREF.sv && voices.find(v => v.name === PREF.sv) || opp || others[0] || p;
  return [p.name, s.name];
}
function fillVoices() {
  loadVoices();
  const [dp, ds] = defaultVoices();
  [["#pv", dp], ["#sv", ds]].forEach(([id, def]) => {
    const sel = $(id); if (!sel) return;
    if (!("speechSynthesis" in window) || !voices.length) { sel.innerHTML = `<option value="">Default</option>`; if (!("speechSynthesis" in window)) { sel.disabled = true; $("#play") && ($("#play").disabled = true); $("#nowline") && ($("#nowline").textContent = "This browser can't read text aloud. Try Chrome, Edge, or Safari."); } return; }
    sel.innerHTML = voices.map(v => `<option value="${esc(v.name)}">${esc(label(v))}</option>`).join("");
    sel.value = def;
  });
}
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => { if ($("#pv")) fillVoices(); };
function utter(text, sp) {
  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(text);
    const name = sp === "S" ? ($("#sv") ? $("#sv").value : PREF.sv) : ($("#pv") ? $("#pv").value : PREF.pv);
    const v = voices.find(x => x.name === name);
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-CA";
    const same = sp === "S" && $("#sv") && $("#pv") && $("#sv").value === $("#pv").value;
    u.pitch = same ? 1.25 : 1;
    u.rate = +PREF.rate;
    let fin = false; const end = () => { if (!fin) { fin = true; res(); } };
    u.onend = end; u.onerror = end;
    speechSynthesis.speak(u);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));
const roleName = () => { const s = ALL.find(x => x.num === ST.num); return ((s && s.lines.find(l => l[0] === "S")) || [])[2] || ""; };
let REC = null;
function playSeg(k, flow, lead) {
  const T = ALL.find(x => x.num === ST.num).t, a = REC; if (!a || !T) return Promise.resolve();
  const end = flow && k + 1 < T.length ? T[k + 1][0] : T[k][1] + 0.05, id = RUN;
  const from = lead ? 0 : T[k][0];
  a.playbackRate = +PREF.arate;
  if (a.paused || Math.abs(a.currentTime - from) > 0.4) a.currentTime = from;
  return new Promise(res => {
    const tick = () => { if (id !== RUN || a.ended) { res(); return; } if (a.currentTime >= end) { if (!flow) a.pause(); res(); return; } requestAnimationFrame(tick); };
    a.play().then(() => requestAnimationFrame(tick)).catch(() => res());
  });
}
function highlight(k) {
  document.querySelectorAll(".seg.on").forEach(e => e.classList.remove("on"));
  document.querySelectorAll(".masked .turns span.on").forEach(e => e.classList.remove("on"));
  if (k < 0) return;
  const e = document.querySelector(`.seg[data-seg="${k}"]`);
  if (e) { e.classList.add("on"); const r = e.getBoundingClientRect(); if (r.top < 90 || r.bottom > innerHeight - 40) e.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); }
  const t = document.querySelector(`.masked .turns span[data-turn="${ST.segs[k].turn}"]`); if (t) t.classList.add("on");
}
function status(k, extra) {
  const g = ST.segs[k], nl = $("#nowline"), trk = $("#trk");
  if (nl && g) nl.innerHTML = `<b>${esc(g.name)}</b> · sentence ${k + 1} of ${ST.segs.length}${extra ? ` · ${extra}` : ""}`;
  if (trk) trk.style.width = `${((k + 1) / ST.segs.length) * 100}%`;
}
async function playFrom(start, { echo = false, only = false } = {}) {
  if (!ST.hasAudio && !("speechSynthesis" in window)) return;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (REC && ST.hasAudio) REC.pause();
  const id = ++RUN; setPlaying(true);
  for (let k = start; k < ST.segs.length; k++) {
    if (id !== RUN) return;
    const g = ST.segs[k]; ST.seg = k; highlight(k); status(k); updSeg();
    const mine = echo && ST.roleplay && g.name === roleName();
    const T = ST.hasAudio && ALL.find(x => x.num === ST.num).t, flow = ST.hasAudio && !echo && !only;
    if (mine) { status(k, "your line, say it now"); await wait(T ? (T[k][1] - T[k][0]) * 1000 / +PREF.arate + 1200 : g.t.split(" ").length * 470 / +PREF.rate + 900); }
    else if (ST.hasAudio) await playSeg(k, flow, k === 0 && !only);
    else await utter(g.t, g.sp);
    if (id !== RUN) return;
    if (echo && !mine) { status(k, "your turn, repeat it"); await wait(T ? (T[k][1] - T[k][0]) * 1000 * +PREF.gap / +PREF.arate + 700 : g.t.split(" ").length * 380 * +PREF.gap / +PREF.rate + 700); }
    else if (!ST.hasAudio && k + 1 < ST.segs.length && ST.segs[k + 1].turn !== g.turn) await wait(260);
    if (only) break;
  }
  if (id === RUN) { setPlaying(false); highlight(-1); const nl = $("#nowline"); if (nl) nl.textContent = only ? `Sentence ${ST.seg + 1} of ${ST.segs.length}. Play it again or go to the next one.` : "Finished. Press Play to hear it again."; }
}
function setPlaying(on) { const p = $("#play"); if (p) p.textContent = on ? "Playing…" : "Play"; }
function stopAll() {
  RUN++;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (REC) REC.pause();
  setPlaying(false); highlight(-1);
}
function updSeg() { const b = $("#splay"); if (b) b.textContent = `Play sentence ${ST.seg + 1} of ${ST.segs.length}`; }

function wirePlayer(s, opts = {}) {
  if (ST.hasAudio) {
    if (!REC || REC.dataset.n != ST.num) { REC = new Audio(audioUrl(ST.num)); REC.preload = "auto"; REC.dataset.n = ST.num; }
    $("#arate").value = ["0.75", "0.9", "1"].includes(PREF.arate) ? PREF.arate : "1";
    $("#arate").onchange = e => { PREF.arate = e.target.value; savePref(); REC.playbackRate = +e.target.value; };
    $("#back10").onclick = () => { const T = ALL.find(x => x.num === ST.num).t; const at = Math.max(0, (REC.currentTime || 0) - 10); let k = 0; T.forEach((g, i) => { if (g[0] <= at) k = i; }); ST.seg = k; playFrom(k); };
  } else {
  fillVoices();
  $("#rate").value = PREF.rate;
  $("#rate").onchange = e => { PREF.rate = e.target.value; savePref(); };
  $("#pv").onchange = e => { PREF.pv = e.target.value; savePref(); };
  if ($("#sv")) $("#sv").onchange = e => { PREF.sv = e.target.value; savePref(); };
  }
  if ($("#gap")) { $("#gap").value = PREF.gap; $("#gap").onchange = e => { PREF.gap = e.target.value; savePref(); }; }
  if ($("#roleplay")) $("#roleplay").onchange = e => ST.roleplay = e.target.checked;
  $("#play").onclick = () => playFrom(opts.resume && ST.seg < ST.segs.length - 1 ? ST.seg : 0, { echo: !!opts.echo });
  $("#stop").onclick = stopAll;
  if ($("#splay")) {
    updSeg();
    $("#splay").onclick = () => playFrom(ST.seg, { only: true });
    $("#sprev").onclick = () => { ST.seg = Math.max(0, ST.seg - 1); playFrom(ST.seg, { only: true }); };
    $("#snext").onclick = () => { ST.seg = Math.min(ST.segs.length - 1, ST.seg + 1); playFrom(ST.seg, { only: true }); };
  }
  document.querySelectorAll(".seg").forEach(e => e.onclick = () => playFrom(+e.dataset.seg, { only: !!opts.tapOne, echo: !!opts.echo }));
}

function nextRow(k) {
  return `<div class="nextrow">${k > 0 ? `<button class="btn secondary" data-go="${k - 1}">Back to round ${k}</button>` : "<span></span>"}${k < 5 ? `<button class="btn" data-go="${k + 1}">Go to round ${k + 2}: ${ROUNDS[k + 1][0].toLowerCase()}</button>` : `<button class="btn gold" id="finish">${DONE.has(ST.num) ? "Completed ✓" : "Mark this story as completed"}</button>`}</div>`;
}

function renderPanel(s) {
  const k = ST.round, P = $("#panel"), dlg = true;
  const answerBox = `<div class="field"><label for="answer">Your transcription</label><textarea id="answer" placeholder="Write exactly what you hear. You don't need to write the speakers' names.">${esc(ST.answer)}</textarea></div>`;
  const gistQs = ["Who is talking, and where are they?", "What is the problem, the news, or the question?", "How does the conversation end?"];
  if (k === 0) P.innerHTML = `<h3>Round 1: Listen for the main idea</h3>
    <p class="hint">Listen to the whole exchange once. Don't write while you listen. When it finishes, answer these questions in your own words.</p>
    ${playerHTML()}${dialogueHTML(s, false)}
    <ul class="prompts" style="margin-top:18px">${gistQs.map(q => `<li>${q}</li>`).join("")}</ul>
    <div class="field"><label for="gist">Your answers</label><textarea id="gist" class="short">${esc(ST.gist)}</textarea></div>${nextRow(k)}`;
  if (k === 1) P.innerHTML = `<h3>Round 2: Transcribe</h3>
    <p class="hint">Play one sentence at a time and write exactly what you hear. Replay a sentence as many times as you need. If you can't hear a word, leave a space and keep going.</p>
    ${playerHTML({ lines: true })}${dialogueHTML(s, false)}${answerBox}${nextRow(k)}`;
  if (k === 2) P.innerHTML = `<h3>Round 3: Listen again and fix</h3>
    <p class="hint">Play the whole story from the beginning and follow your transcription. Fix anything you're unsure about. Listen closely for the small words: <i>a, the, to, of, it's, don't, that</i>.</p>
    ${playerHTML()}${answerBox}${nextRow(k)}`;
  if (k === 3) P.innerHTML = `<h3>Round 4: Compare</h3>
    <p class="hint">Check your transcription against the text. Look at the words you missed. Were they small words? Words linked together? New words you didn't know?</p>
    ${answerBox}<div class="actions"><button class="btn gold" id="check">Check my transcription</button></div><div id="result"></div>${nextRow(k)}`;
  if (k === 4) P.innerHTML = `<h3>Round 5: Shadow</h3>
    <p class="hint">Now the text is visible. Follow the highlight while the voices speak, and tap any sentence to hear it from there. Then play it again and speak along with the voices, at the same time, copying their rhythm and the small words.</p>
    ${playerHTML({ resume: false })}${dialogueHTML(s, true)}
    <div class="listenfor"><h4>Listen for</h4><p>${esc(s.F)}</p>${s.V ? `<p><b>Words and phrases:</b> ${esc(s.V)}</p>` : ""}</div>${nextRow(k)}`;
  if (k === 5) P.innerHTML = `<h3>Round 6: Retell and Respond</h3>
    <p class="hint">First, echo: after each sentence there's a pause, so say it out loud. Then tick the box and take ${esc(roleName())}'s part: that voice goes quiet and you say the lines yourself. Finally, close the text and tell the story in your own words, as if you were telling a friend. Last, answer two short situations in your own words.</p>
    ${playerHTML({ echo: true })}${dialogueHTML(s, true)}
    <div class="mine"><h4>Tell it in your own words</h4>
      <ul class="prompts"><li>Who is in the story, and where are they?</li><li>What happens first, next, and at the end?</li><li>Use at least three of the words from “Listen for.”</li><li>Say it out loud in one or two minutes, without looking at the text.</li></ul>
      <div class="field"><label for="mineTxt">My notes (saved in this browser)</label><textarea id="mineTxt" class="short">${esc(store.get("mine:" + s.num, ""))}</textarea></div>
    </div><div class="respond"><h4>Respond</h4><p class="hint">Now it's your turn. Read the situation, say your answer out loud, and write it if you like. Then compare it with the model answer.</p>
      ${(s.R || []).map((r, i) => `<div class="rsp"><p class="rsit">${esc(r[0])}</p><p class="rq"><b>${esc(r[1])}:</b> “${esc(r[2])}”</p><div class="field"><label for="rsp${i}">Your answer (saved in this browser)</label><textarea id="rsp${i}" class="short" data-rsp="${i}">${esc(store.get(`rsp:${s.num}:${i}`, ""))}</textarea></div><button class="btn secondary" data-model="${i}">Show a model answer</button><p class="model" id="model${i}" hidden><b>Model answer:</b> ${esc(r[3])}<span>Your answer doesn't have to match. Any natural, polite reply that fits the situation is good.</span></p></div>`).join("")}
    </div>${nextRow(k)}`;
  if ($("#mineTxt")) $("#mineTxt").oninput = e => store.set("mine:" + s.num, e.target.value);
  P.querySelectorAll("[data-rsp]").forEach(t => t.oninput = e => store.set(`rsp:${ST.num}:${t.dataset.rsp}`, e.target.value));
  P.querySelectorAll("[data-model]").forEach(b => b.onclick = () => { const m = $("#model" + b.dataset.model); m.hidden = !m.hidden; b.textContent = m.hidden ? "Show a model answer" : "Hide the model answer"; });
  if (k !== 3) wirePlayer(s, { echo: k === 5, tapOne: k === 5 });
  P.querySelectorAll("[data-go]").forEach(b => b.onclick = () => goRound(+b.dataset.go));
  if ($("#finish")) $("#finish").onclick = () => { ST.done.add(5); markDone(ST.num); renderScript(ST.num); renderNav($("#q").value); };
  if (k === 3) { $("#check").onclick = () => { saveFields(); check(s); }; if (ST.result) showResult(s); }
}

/* ---------- transcription check ---------- */
const norm = w => w.toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9'éãçõáíóúâêô½%]/g, "").replace(/^'+|'+$/g, "");
function tokens(t) { return t.replace(/[“”]/g, '"').replace(/—|–/g, " ").split(/\s+/).filter(Boolean).map(w => ({ raw: w, n: norm(w) })).filter(x => x.n); }
function check(s) {
  const FULL = tokens(fullText(s)), B = tokens(ST.answer);
  if (!B.length) { $("#result").innerHTML = `<div class="result"><p>Your transcription is empty. Go back to round 2, write what you hear, and then check it here.</p></div>`; return; }
  const reach = Math.min(FULL.length, Math.round(B.length * 1.6) + 15);
  const A = FULL.slice(0, reach), tail = FULL.slice(reach), n = A.length, m = B.length;
  const L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i].n === B[j].n ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && A[i].n === B[j].n) { ops.push(["same", i]); i++; j++; }
    else if (j < m && (i >= n || L[i][j + 1] >= L[i + 1][j])) { ops.push(["extra", j]); j++; }
    else { ops.push(["miss", i]); i++; }
  }
  const hits = ops.filter(o => o[0] === "same").map(o => o[1]);
  while (hits.length > 1 && hits[hits.length - 1] - hits[hits.length - 2] > 8) hits.pop();
  const lastA = hits.length ? hits[hits.length - 1] : -1;
  if (lastA < 0) { ST.result = { empty: true }; showResult(s); return; }
  let out = [], matched = 0, graded = 0, small = new Map(), other = [], extra = [], rest = [];
  ops.forEach(([kd, x]) => {
    if (kd === "same" && x <= lastA) { out.push(esc(A[x].raw)); matched++; graded++; }
    else if (kd === "same") rest.push(esc(A[x].raw));
    else if (kd === "extra") { if (!rest.length) { out.push(`<del>${esc(B[x].raw)}</del>`); extra.push(B[x].n); } }
    else if (x > lastA) rest.push(esc(A[x].raw));
    else { graded++; const w = A[x].n, sm = SMALL.has(w); if (sm) small.set(w, (small.get(w) || 0) + 1); else other.push(w); out.push(`<mark class="${sm ? "small" : ""}">${esc(A[x].raw)}</mark>`); }
  });
  tail.forEach(w => rest.push(esc(w.raw)));
  ST.result = { out, rest, matched, graded, small: [...small].sort((a, b) => b[1] - a[1]), other, extra };
  ST.done.add(3); showResult(s);
}
function showResult(s) {
  const R = ST.result, box = $("#result"); if (!box) return;
  if (R.empty) { box.innerHTML = `<div class="result"><p>None of your words matched the text yet. Listen again from the beginning and try the first few sentences.</p></div>`; return; }
  const pct = Math.floor(R.matched / R.graded * 100), partial = R.rest.length > 0;
  const smallList = R.small.map(([w, c]) => c > 1 ? `${esc(w)} (${c})` : esc(w)).join(", ");
  const acad = [...new Set(R.other.filter(w => w.length > 7))].slice(0, 20);
  box.innerHTML = `<div class="result">
    <p class="score">${pct}%<small>${R.matched} of ${R.graded} words correct${partial ? ", checked up to where you stopped" : ""}</small></p>
    <p class="legend"><mark>missed</mark> <mark class="small">missed small word</mark> <del>extra or misspelled</del>${partial ? ` <span class="rest">not transcribed yet</span>` : ""}</p>
    <div class="diff">${R.out.join(" ")}${partial ? ` <span class="rest">${R.rest.join(" ")}</span>` : ""}</div>
    ${smallList ? `<p class="smalls"><b>Small words you missed:</b> ${smallList}</p>` : `<p class="smalls">You didn't miss any small words. Well done.</p>`}
    ${acad.length ? `<p class="smalls"><b>Longer words to review:</b> ${acad.map(esc).join(", ")}</p>` : ""}
    <div class="sendbox">
      <div class="field"><label for="sname">Your name</label><input id="sname" value="${esc(ST.name || "")}" autocomplete="name"></div>
      <div class="actions"><button class="btn" id="send">Email my results to Ron</button><button class="btn secondary" id="copy">Copy my results</button></div>
      <p>This opens your email app with your results already written. Nothing is sent until you press send. If your email app doesn't open, copy your results and paste them into an email to ${TEACHER_EMAIL}.</p>
      <p class="status" id="status" role="status"></p>
    </div></div>`;
  $("#sname").oninput = e => { ST.name = e.target.value; store.set("name", ST.name); };
  $("#send").onclick = () => { location.href = `mailto:${TEACHER_EMAIL}?subject=${encodeURIComponent(`Listening Lab sample: Story ${s.num}, ${s.title}`)}&body=${encodeURIComponent(resultText(s))}`; };
  $("#copy").onclick = async () => {
    const t = resultText(s);
    try { await navigator.clipboard.writeText(t); } catch { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
    $("#status").textContent = "Copied. Paste it into an email or a message to Ron.";
  };
}
function resultText(s) {
  const R = ST.result, pct = Math.floor(R.matched / R.graded * 100);
  const cap = (a, k) => a.length > k ? a.slice(0, k).join(", ") + ` (and ${a.length - k} more)` : a.join(", ") || "none";
  const lines = ["Listening Lab results", `Name: ${ST.name || "(not given)"}`, `Story: ${s.num}. ${s.title} (Part ${s.part}: ${s.partTitle})`,
    `Score: ${pct}% (${R.matched} of ${R.graded} words${R.rest.length ? ", checked up to where I stopped" : ""})`, "",
    `Small words I missed: ${cap(R.small.map(([w, c]) => c > 1 ? `${w} (${c})` : w), 30)}`,
    `Other words I missed: ${cap(R.other, 40)}`, `Extra or misspelled words I wrote: ${cap(R.extra, 30)}`];
  if (ST.gist) lines.push("", `My answers after the first listen: ${ST.gist.slice(0, 500)}`);
  return lines.join("\n");
}

/* ---------- routing ---------- */
function route() {
  const h = location.hash;
  if (h.startsWith("#script-")) renderScript(+h.slice(8)); else renderHome();
  renderNav($("#q").value); closeMenu();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-script],[data-home]"); if (!b) return;
  location.hash = b.hasAttribute("data-home") ? "#home" : "#script-" + b.dataset.script;
});
$("#q").addEventListener("input", e => renderNav(e.target.value));
function closeMenu() { $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false"); }
$("#menuBtn").onclick = () => { $("#sidebar").classList.add("open"); $("#scrim").classList.add("open"); $("#menuBtn").setAttribute("aria-expanded", "true"); };
$("#scrim").onclick = closeMenu;
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeMenu(); stopAll(); } });
window.addEventListener("hashchange", route);
window.addEventListener("beforeunload", () => { if ("speechSynthesis" in window) speechSynthesis.cancel(); });
renderProgress();
route();
</script>
</body>
